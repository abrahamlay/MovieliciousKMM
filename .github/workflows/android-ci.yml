name: Android CI

on:
  push:
    branches: [ master, develop, 'feature/**' ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx4096M -Dfile.encoding=UTF-8"

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt --parallel --build-cache --no-daemon

      - name: Run lint
        run: ./gradlew :shared:lintDevelopmentDebug :composeApp:lintDevelopmentDebug --parallel --build-cache --no-daemon

  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDevelopmentDebug --parallel --build-cache --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/development/debug/*.apk
          retention-days: 7

  android-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :shared:testDevelopmentDebugUnitTest :composeApp:testDevelopmentDebugUnitTest --parallel --build-cache --no-daemon

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            shared/build/test-results/testDevelopmentDebugUnitTest/*.xml
            composeApp/build/test-results/testDevelopmentDebugUnitTest/*.xml
          retention-days: 7

  android-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: android-unit-tests
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kover coverage verification (60% minimum)
        run: ./gradlew :shared:koverXmlReport :composeApp:koverXmlReport :shared:koverVerify :composeApp:koverVerify --parallel --build-cache --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage-report
          path: |
            shared/build/reports/kover/
            composeApp/build/reports/kover/
          retention-days: 7

  android-instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    if: false # Enable when you have instrumented tests
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        run: ./gradlew :composeApp:connectedDebugAndroidTest --parallel --build-cache --no-daemon

  # ── Auto-distribute to Firebase on push to develop/master ────────────────
  firebase-distribute:
    name: Auto-Distribute to Firebase
    runs-on: ubuntu-latest
    needs: [android-build, android-unit-tests, android-coverage]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') && secrets.FIREBASE_TOKEN != ''
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release notes
        id: release-notes
        run: |
          git log -1 --pretty=%B > release-notes.txt
          echo "=== Release Notes ==="
          cat release-notes.txt

      - name: Resolve Firebase App ID
        id: firebase-config
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            APP_ID="${{ secrets.FIREBASE_APP_ID_STAGING }}"
            FLAVOR="staging"
            GROUPS="qa-team"
          else
            APP_ID="${{ secrets.FIREBASE_APP_ID_PRODUCTION }}"
            FLAVOR="production"
            GROUPS="internal"
          fi

          if [ -z "$APP_ID" ]; then
            echo "::warning::Firebase App ID not set for $FLAVOR — skipping distribution"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
            echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
            echo "groups=$GROUPS" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APK
        if: steps.firebase-config.outputs.skip != 'true'
        run: |
          ./gradlew :composeApp:assemble${{ steps.firebase-config.outputs.flavor }}Release \
            --parallel --build-cache --no-daemon

      - name: Install Firebase CLI
        if: steps.firebase-config.outputs.skip != 'true'
        run: curl -sL https://firebase.tools | bash

      - name: Upload to Firebase App Distribution
        if: steps.firebase-config.outputs.skip != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ steps.firebase-config.outputs.app_id }}
        run: |
          APK_FILE=$(find composeApp/build/outputs/apk/${{ steps.firebase-config.outputs.flavor }}/release -name "*.apk" | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found"
            exit 1
          fi

          echo "Uploading $APK_FILE to Firebase App Distribution..."

          firebase appdistribution:distribute "$APK_FILE" \
            --app "$FIREBASE_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --release-notes-file release-notes.txt \
            --groups "${{ steps.firebase-config.outputs.groups }}"

      - name: Distribution complete
        if: steps.firebase-config.outputs.skip != 'true'
        run: |
          echo "✅ Distributed ${{ steps.firebase-config.outputs.flavor }} APK to Firebase App Distribution"
