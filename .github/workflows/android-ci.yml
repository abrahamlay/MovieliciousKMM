name: Android CI

on:
  push:
    branches: [ master, develop, 'feature/**' ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Run lint
        run: ./gradlew :shared:lintDevelopmentDebug :composeApp:lintDevelopmentDebug

  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDevelopmentDebug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/development/debug/*.apk
          retention-days: 7

  android-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Run unit tests
        run: ./gradlew :shared:testDevelopmentDebugUnitTest :composeApp:testDevelopmentDebugUnitTest

  android-instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    if: false # Enable when you have instrumented tests
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Run instrumented tests
        run: ./gradlew :composeApp:connectedDebugAndroidTest
