name: Android CI

on:
  push:
    branches: [ master, develop, 'feature/**' ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'shared/**'
      - 'composeApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx4096M -Dfile.encoding=UTF-8"

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew :shared:lintDevelopmentDebug :composeApp:lintDevelopmentDebug --parallel --build-cache --no-daemon

  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDevelopmentDebug --parallel --build-cache --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/development/debug/*.apk
          retention-days: 7

  android-unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :shared:testDevelopmentDebugUnitTest :composeApp:testDevelopmentDebugUnitTest --parallel --build-cache --no-daemon

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            shared/build/test-results/testDevelopmentDebugUnitTest/*.xml
            composeApp/build/test-results/testDevelopmentDebugUnitTest/*.xml
          retention-days: 7

  android-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: android-unit-tests
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kover coverage verification (60% minimum)
        run: ./gradlew :shared:koverXmlReport :composeApp:koverXmlReport :shared:koverVerify :composeApp:koverVerify --parallel --build-cache --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-coverage-report
          path: |
            shared/build/reports/kover/
            composeApp/build/reports/kover/
          retention-days: 7

  android-instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    if: false # Enable when you have instrumented tests
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        run: ./gradlew :composeApp:connectedDebugAndroidTest --parallel --build-cache --no-daemon


