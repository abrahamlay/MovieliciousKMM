name: iOS CI

on:
  push:
    branches: [ master, develop, 'feature/**' ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx4096M -Dfile.encoding=UTF-8"

jobs:
  ios-lint:
    name: Lint & Static Analysis
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # macos-latest (macOS 15 Sequoia) ships with Xcode 16.2+
          # Xcode 16.0 is NOT available on macOS 15
          xcode-version: '16.2'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run detekt
        run: ./gradlew detekt --parallel --build-cache --no-daemon

      - name: Run shared module lint
        run: ./gradlew :shared:lintDevelopmentDebug --parallel --build-cache --no-daemon

  ios-build:
    name: Build iOS
    runs-on: macos-latest
    needs: ios-lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Clean stale CocoaPods cache
        run: rm -rf shared/build/cocoapods/

      - name: Generate Dummy Framework for Pod Install
        run: ./gradlew :shared:generateDummyFramework --parallel --build-cache --no-daemon

      - name: Install CocoaPods
        working-directory: iosApp
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod install --repo-update

      - name: Create and boot iOS Simulator
        run: |
          # Find a compatible iOS runtime (prefer 18.x, fallback to any available)
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['runtimes']
          for r in runtimes:
              if r['isAvailable'] and 'iOS 18' in r['name']:
                  print(r['identifier'])
                  sys.exit(0)
          for r in runtimes:
              if r['isAvailable'] and 'iOS' in r['name']:
                  print(r['identifier'])
                  sys.exit(0)
          sys.exit(1)
          ")
          echo "Using runtime: $RUNTIME_ID"

          # Find or create a simulator device
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, device_list in devices.items():
              for d in device_list:
                  if d['name'] == 'CI-iPhone' and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          " 2>/dev/null || true)

          if [ -z "$SIMULATOR_UDID" ]; then
            # Try iPhone-16-Pro first, fallback to iPhone-15, then iPhone-14
            for DEVICE in "iPhone-16-Pro" "iPhone-15" "iPhone-14"; do
              DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.${DEVICE}"
              if xcrun simctl list devicetypes | grep -q "$DEVICE"; then
                SIMULATOR_UDID=$(xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")
                echo "Created simulator with device type: $DEVICE"
                break
              fi
            done
            if [ -z "$SIMULATOR_UDID" ]; then
              echo "ERROR: No compatible device type found"
              xcrun simctl list devicetypes
              exit 1
            fi
          else
            echo "Using existing simulator: $SIMULATOR_UDID"
          fi

          # Boot the simulator
          xcrun simctl boot "$SIMULATOR_UDID" || true
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Build iOS App
        working-directory: iosApp
        run: |
          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            iosApp/build/Build/Products/**/*.app
            iosApp/build/Build/Products/**/*.dSYM
          retention-days: 7

  ios-unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    needs: ios-lint
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Run Kotlin iOS unit tests
        run: ./gradlew :shared:iosSimulatorArm64Test --parallel --build-cache --no-daemon

      - name: Publish Kotlin Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-test-results
          path: shared/build/test-results/iosSimulatorArm64Test/*.xml
          retention-days: 7

      - name: Generate Dummy Framework for Pod Install
        run: ./gradlew :shared:generateDummyFramework --parallel --build-cache --no-daemon

      - name: Install CocoaPods
        working-directory: iosApp
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod install --repo-update

      - name: Create and boot iOS Simulator
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['runtimes']
          for r in runtimes:
              if r['isAvailable'] and 'iOS 18' in r['name']:
                  print(r['identifier'])
                  sys.exit(0)
          for r in runtimes:
              if r['isAvailable'] and 'iOS' in r['name']:
                  print(r['identifier'])
                  sys.exit(0)
          sys.exit(1)
          ")

          SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, device_list in devices.items():
              for d in device_list:
                  if d['name'] == 'CI-iPhone' and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          " 2>/dev/null || true)

          if [ -z "$SIMULATOR_UDID" ]; then
            for DEVICE in "iPhone-16-Pro" "iPhone-15" "iPhone-14"; do
              DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.${DEVICE}"
              if xcrun simctl list devicetypes | grep -q "$DEVICE"; then
                SIMULATOR_UDID=$(xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")
                break
              fi
            done
          fi

          xcrun simctl boot "$SIMULATOR_UDID" || true
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Run iOS app tests (if test target exists)
        working-directory: iosApp
        continue-on-error: true
        run: |
          SCHEMES=$(xcodebuild -workspace iosApp.xcworkspace -list -json 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get('project', {}).get('schemes', [])
          test_schemes = [s for s in schemes if 'Test' in s]
          print(' '.join(test_schemes))
          " 2>/dev/null || true)

          if [ -n "$SCHEMES" ]; then
            for SCHEME in $SCHEMES; do
              echo "Running tests for scheme: $SCHEME"
              xcodebuild -workspace iosApp.xcworkspace \
                -scheme "$SCHEME" \
                -configuration Debug \
                -sdk iphonesimulator \
                -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
                test \
                CODE_SIGNING_ALLOWED=NO \
                COMPILER_INDEX_STORE_ENABLE=NO \
                -resultBundlePath "TestResults/${SCHEME}.xcresult"
            done
          else
            echo "No iOS test schemes found — skipping xcodebuild test step"
          fi

      - name: Upload Xcode test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-test-results
          path: iosApp/TestResults/**/*.xcresult
          retention-days: 7

  ios-coverage:
    name: Code Coverage
    runs-on: macos-latest
    needs: ios-unit-tests
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kover coverage verification (60% minimum)
        run: ./gradlew :shared:koverXmlReport :shared:koverVerify --parallel --build-cache --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: shared/build/reports/kover/
          retention-days: 7
