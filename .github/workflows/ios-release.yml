name: iOS Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'TestFlight'
        type: choice
        options:
          - TestFlight
          - AppStore
      configuration:
        description: 'Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  GRADLE_OPTS: "-Xmx4096M -Dfile.encoding=UTF-8"

permissions:
  contents: read
  id-token: write

jobs:
  ios-release:
    name: Release iOS
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # ── Xcode MUST be set up BEFORE any Gradle tasks that need the toolchain ──
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # macos-latest (macOS 15 Sequoia) ships with Xcode 16.2+
          xcode-version: '16.2'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ── Generate dummy framework so pod install can resolve the Shared podspec ──
      - name: Generate Dummy Framework
        run: ./gradlew :shared:generateDummyFramework --parallel --build-cache --no-daemon

      # ── Install pods (uses the dummy framework; real framework built by xcodebuild) ──
      - name: Install CocoaPods
        working-directory: iosApp
        run: |
          gem list cocoapods -i || sudo gem install cocoapods
          pod install --repo-update

      # ── Build the real Kotlin framework for Xcode (needs Xcode toolchain) ──
      - name: Build iOS Framework for Xcode
        env:
          JAVA_HOME: ${{ env.JAVA_HOME || '/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home' }}
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode --parallel --build-cache --no-daemon

      # ── Code signing setup ──
      - name: Setup iOS Code Signing
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db
          security set-keychain-settings -lut 21600 build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain-db

          # Import certificate (use P12_PASSWORD secret, restrict with -T)
          echo -n "$APPLE_CERTIFICATES_P12" | base64 -d > certificates.p12
          security import certificates.p12 \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12 \
            -k build.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" build.keychain-db
          security list-keychain -d user -s build.keychain-db

          # Clean up
          rm -f certificates.p12

      - name: Setup Provisioning Profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_PROVISIONING_PROFILE" | base64 -d > MovieliciousKMM.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp MovieliciousKMM.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          rm -f MovieliciousKMM.mobileprovision

      # ── Create ExportOptions.plist if it doesn't exist ──
      - name: Create ExportOptions.plist
        working-directory: iosApp
        run: |
          if [ ! -f ExportOptions.plist ]; then
            echo "ExportOptions.plist not found — generating one for ${{ inputs.environment }}"
            cat > ExportOptions.plist << 'PLIST'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store-connect</string>
                <key>teamID</key>
                <string>${{ secrets.APPLE_TEAM_ID }}</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>provisioningProfiles</key>
                <dict>
                    <key>${{ secrets.APPLE_BUNDLE_ID }}</key>
                    <string>${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}</string>
                </dict>
                <key>uploadSymbols</key>
                <true/>
                <key>compileBitcode</key>
                <false/>
            </dict>
            </plist>
            PLIST
            echo "Generated ExportOptions.plist"
          else
            echo "ExportOptions.plist already exists"
          fi

      # ── Archive the app ──
      - name: Archive iOS App
        working-directory: iosApp
        env:
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration ${{ inputs.configuration }} \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            COMPILER_INDEX_STORE_ENABLE=NO

      # ── Export the archive to IPA ──
      - name: Export iOS Archive
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: iosApp/build/*.ipa
          retention-days: 14

  ios-deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-latest
    needs: ios-release
    if: inputs.environment == 'TestFlight'
    environment: TestFlight
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: ./

      - name: Upload to App Store Connect (notarytool)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IPA_FILE=$(ls *.ipa | head -1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun notarytool submit "$IPA_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

  ios-deploy-appstore:
    name: Deploy to App Store
    runs-on: macos-latest
    needs: ios-release
    if: inputs.environment == 'AppStore'
    environment: AppStore
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: ./

      - name: Upload to App Store Connect (notarytool)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          IPA_FILE=$(ls *.ipa | head -1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun notarytool submit "$IPA_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
